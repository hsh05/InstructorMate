name: instructor_mate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Merged Dependencies
  http: ^1.6.0
  http_parser: ^4.0.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  csv: ^6.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  app_settings: ^5.1.1
  flutter_timezone: ^5.0.2
  flutter_dotenv: ^6.0.0
  path_provider: ^2.1.2
  flutter_ringtone_player: ^4.0.0
  crypto: ^3.0.3
  permission_handler: ^11.3.0
  pdf: ^3.10.0
  desktop_drop: ^0.7.0
  cross_file: ^0.3.5+2
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^7.2.0
  provider: ^6.1.5+1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48